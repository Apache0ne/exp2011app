name: Build + Release iPhone Hello Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SIDELOADER_REPO: https://github.com/Dadoum/Sideloader.git
  SIDELOADER_COMMIT: a589cf11a3ac7c1c26b2f18aa5acdc8afb6dc915
  PROVISION_COMMIT: 645d56d8e8c86c057893321843db00b21f1aaeb2
  D_COMPILER: ldc-1.34.0
  LIBIMOBILEDEVICE_WINDOWS_TAG: v20260809-74585f8

jobs:
  build-ios:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-status]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen
      - name: Build real iPhone app
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project Exp2011App.xcodeproj -scheme Exp2011App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Exp2011App.app Payload/
          /usr/bin/zip -qry Exp2011App-unsigned.ipa Payload
          unzip -l Exp2011App-unsigned.ipa
          shasum -a 256 Exp2011App-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Exp2011App-unsigned-ipa
          path: Exp2011App-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  # Match Dadoum/Sideloader's own Windows CI path instead of compiling the
  # SysV<->MSVC CoreADI bridge natively on Windows with a different LDC.
  build-sideloader-windows:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-status]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dadoum-compatible LDC
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ env.D_COMPILER }}

      - name: Install Windows cross-target dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld p7zip-full
          ldc2 --version
          dub --version

      - name: Fetch exact Sideloader source and apply local UI/trace patches
        shell: bash
        run: |
          set -euo pipefail
          git clone "$SIDELOADER_REPO" sideloader-src
          git -C sideloader-src checkout --detach "$SIDELOADER_COMMIT"
          test "$(git -C sideloader-src rev-parse HEAD)" = "$SIDELOADER_COMMIT"
          python3 tools/sideloader/patch_sideloader.py sideloader-src

      # Keep this in lockstep with Dadoum/Sideloader's own
      # .github/actions/target-x86_64-windows-msvc/action.yml.
      - name: Configure Dadoum x86_64-windows-msvc target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ldc"
          LDC_VERSION=$(ldc2 --version | head -n 1 | grep -oE "[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*")
          test "$LDC_VERSION" = "1.34.0"

          cat > "$HOME/.ldc/ldc2.conf" <<EOF
          "x86_64-.*-windows-msvc":
          {
              // default switches injected before all explicit command-line switches
              switches = [
                  "-defaultlib=phobos2-ldc,druntime-ldc",
              ];
              // default switches appended after all explicit command-line switches
              post-switches = [
                  "-I$HOME/ldc2-$LDC_VERSION-windows-x64/import",
              ];
              // default directories to be searched for libraries when linking
              lib-dirs = [
                  "$HOME/ldc2-$LDC_VERSION-windows-x64/lib",
              ];
          };
          EOF

          curl -fL --retry 3 \
            "https://github.com/ldc-developers/ldc/releases/download/v$LDC_VERSION/ldc2-$LDC_VERSION-windows-x64.7z" \
            -o "/tmp/ldc2-$LDC_VERSION-windows-x64.7z"
          7z x "/tmp/ldc2-$LDC_VERSION-windows-x64.7z" -o"$HOME" > /dev/null

          test -d "$HOME/ldc2-$LDC_VERSION-windows-x64/import"
          test -d "$HOME/ldc2-$LDC_VERSION-windows-x64/lib"
          echo '--- effective LDC target configuration ---'
          cat "$HOME/.ldc/ldc2.conf"
          echo '--- Windows LDC payload ---'
          find "$HOME/ldc2-$LDC_VERSION-windows-x64" -maxdepth 2 -type d -print | sort

      - name: Build Sideloader exactly for x86_64-windows-msvc
        shell: bash
        run: |
          set -euo pipefail
          cd sideloader-src
          dub build -b release-debug --compiler=ldc2 --arch x86_64-windows-msvc :cli-frontend
          test -f bin/sideloader.exe
          file bin/sideloader.exe
          sha256sum bin/sideloader.exe

      - name: Package cross-built Sideloader and corresponding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sideloader-dist
          cp sideloader-src/bin/sideloader.exe sideloader-dist/
          if [[ -f sideloader-src/bin/sideloader.pdb ]]; then cp sideloader-src/bin/sideloader.pdb sideloader-dist/; fi
          cat > sideloader-dist/sideloader-build-metadata.txt <<EOF
          Sideloader commit: $SIDELOADER_COMMIT
          Provision commit: $PROVISION_COMMIT
          LDC: 1.34.0
          Host: ubuntu-22.04
          Target: x86_64-windows-msvc
          Build: release-debug
          Local source patches: hidden Windows password input + provisioning stage markers only
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('sideloader-src')
          out = Path('sideloader-dist/Sideloader-source.zip')
          excluded = {'.git', '.dub', 'bin'}
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  rel = path.relative_to(root)
                  if any(part in excluded for part in rel.parts):
                      continue
                  if path.is_file():
                      z.write(path, Path('Sideloader-source') / rel)
          PY
          sha256sum sideloader-dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: sideloader-windows-msvc
          path: sideloader-dist/
          if-no-files-found: error
          retention-days: 30

  build-windows-installer:
    needs: [build-ios, build-sideloader-windows]
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Test launcher on Windows PowerShell 5.1
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $launcher = Join-Path $PWD 'tools/windows/Install-Hello-App.ps1'
          $tokens = $null; $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($launcher,[ref]$tokens,[ref]$parseErrors)
          if (@($parseErrors).Count) { throw 'Launcher has PowerShell syntax errors' }
          function Mock-OneDevice { '00000000-MOCK-IPHONE' }
          $devices = @(Mock-OneDevice)
          if ($devices.Count -ne 1 -or $devices[0] -ne '00000000-MOCK-IPHONE') { throw 'One-device regression' }
          $matches = @(Select-String -Path $launcher -Pattern '^\s*\$devices\s*=.*Get-ConnectedDevice')
          $bad = @($matches | Where-Object { $_.Line -notmatch '^\s*\$devices\s*=\s*@\(' })
          if ($bad.Count) { $bad | ForEach-Object { Write-Host $_.Line }; throw 'Found unwrapped device assignment' }
          Write-Host 'PowerShell 5.1 launcher regression PASS'

      - uses: actions/download-artifact@v4
        with:
          name: Exp2011App-unsigned-ipa
          path: incoming

      - uses: actions/download-artifact@v4
        with:
          name: sideloader-windows-msvc
          path: sideloader-dist

      - name: Verify Dadoum-parity Sideloader artifact
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'sideloader-dist/sideloader.exe'
          $metadata = Join-Path $PWD 'sideloader-dist/sideloader-build-metadata.txt'
          if (-not (Test-Path $exe)) { throw 'Missing cross-built sideloader.exe' }
          if (-not (Test-Path $metadata)) { throw 'Missing Sideloader build metadata' }
          Get-Content $metadata | ForEach-Object { Write-Host $_ }
          & $exe version
          if ($LASTEXITCODE) { throw 'Cross-built sideloader.exe did not start on Windows' }

      # Execute the exact cross-built binary on Windows. This is the same
      # Apple Music/CoreADI initialization/provisioning path that crashed on
      # the physical PC, but it needs no iPhone or Apple login.
      - name: Real Windows CoreADI provisioning preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $preflight = Join-Path $env:RUNNER_TEMP 'exp2011app-adi-preflight'
          Remove-Item $preflight -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $preflight | Out-Null
          $env:SIDELOADER_CONFIG_DIR = $preflight
          Push-Location (Join-Path $PWD 'sideloader-dist')
          $lines = @(& .\sideloader.exe -d team list 2>&1)
          $code = $LASTEXITCODE
          Pop-Location
          $lines | ForEach-Object { Write-Host $_ }
          $text = $lines -join "`n"
          Write-Host "CoreADI preflight exit=$code"
          if ($code -eq -1073741819 -or $code -eq 3221225477) { throw 'CoreADI access violation 0xC0000005 reproduced in CI' }
          if ($text -notmatch 'PROVISION-STAGE 3/3') { throw 'CoreADI provisioning did not return successfully' }
          if ($text -notmatch 'Logging in\.\.\.') { throw 'Did not reach post-provisioning login stage' }
          if ($code -ne 1) { throw "Expected noninteractive no-login exit 1, got $code" }
          Write-Host 'REAL WINDOWS COREADI PROVISIONING PASS' -ForegroundColor Green

      - name: Fetch Windows iPhone device runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force device-runtime | Out-Null
          gh release download "$env:LIBIMOBILEDEVICE_WINDOWS_TAG" --repo jrjr/libimobiledevice-windows `
            --pattern 'libimobile-suite-latest_w64.zip' --dir device-runtime
          Expand-Archive device-runtime/libimobile-suite-latest_w64.zip device-runtime/extracted

      - name: Package and smoke-test Windows installer
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist/Exp2011App-OneClick-Windows'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item 'sideloader-dist/sideloader.exe' "$dist/sideloader.exe"
          if (Test-Path 'sideloader-dist/sideloader.pdb') { Copy-Item 'sideloader-dist/sideloader.pdb' "$dist/sideloader.pdb" }
          Copy-Item 'sideloader-dist/sideloader-build-metadata.txt' "$dist/sideloader-build-metadata.txt"
          Copy-Item 'sideloader-dist/Sideloader-source.zip' "$dist/Sideloader-source-$env:SIDELOADER_COMMIT.zip"
          Copy-Item incoming/Exp2011App-unsigned.ipa "$dist/Exp2011App-unsigned.ipa"
          Copy-Item tools/windows/Install-Hello-App.* $dist
          Copy-Item 'device-runtime/extracted/*' $dist -Recurse -Force

          function Alias-Dll([string[]]$patterns,[string]$name) {
            foreach ($p in $patterns) {
              $hit = Get-ChildItem $dist -File -Filter $p | Select-Object -First 1
              if ($hit) { Copy-Item $hit.FullName (Join-Path $dist $name) -Force; return }
            }
            throw "Missing DLL for $name"
          }
          Alias-Dll @('libimobiledevice-1.0*.dll','libimobiledevice*.dll') imobiledevice.dll
          Alias-Dll @('libplist-2.0*.dll','libplist*.dll') plist.dll
          Alias-Dll @('libusbmuxd-2.0*.dll','libusbmuxd*.dll') usbmuxd.dll
          if ($env:VCToolsRedistDir) {
            $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
            if (Test-Path $crt) { Copy-Item "$crt/*.dll" $dist -Force }
          }

          @"
          Exp2011App Hello Test
          iOS source: $env:GITHUB_SHA
          Sideloader: $env:SIDELOADER_COMMIT
          Provision: $env:PROVISION_COMMIT (upstream Sideloader pin)
          LDC: 1.34.0 release-debug
          Build host: ubuntu-22.04
          Target: x86_64-windows-msvc
          GitHub Windows CoreADI provisioning preflight: PASS
          Run: Install-Hello-App.cmd
          "@ | Set-Content "$dist/README-FIRST.txt"

          $required = @('sideloader.exe','sideloader-build-metadata.txt','Exp2011App-unsigned.ipa','Install-Hello-App.cmd','Install-Hello-App.ps1','idevice_id.exe','idevicepair.exe','idevicedevmodectl.exe','imobiledevice.dll','plist.dll','usbmuxd.dll')
          foreach ($f in $required) { if (-not (Test-Path (Join-Path $dist $f))) { throw "Missing $f" } }
          Push-Location $dist
          & .\sideloader.exe version; if ($LASTEXITCODE) { throw 'sideloader smoke test failed' }
          & .\idevice_id.exe --version; if ($LASTEXITCODE) { throw 'idevice_id smoke test failed' }
          & .\idevicepair.exe --version; if ($LASTEXITCODE) { throw 'idevicepair smoke test failed' }
          & .\idevicedevmodectl.exe --version; if ($LASTEXITCODE) { throw 'idevicedevmodectl smoke test failed' }
          Pop-Location
          Compress-Archive "$dist/*" Exp2011App-OneClick-Windows.zip -CompressionLevel Optimal
          Get-FileHash Exp2011App-OneClick-Windows.zip -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: Exp2011App-OneClick-Windows
          path: Exp2011App-OneClick-Windows.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-ios, build-windows-installer]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Exp2011App-unsigned-ipa
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Exp2011App-OneClick-Windows
          path: release-assets
      - name: Publish gated Release
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum Exp2011App-unsigned.ipa Exp2011App-OneClick-Windows.zip > SHA256SUMS.txt
          cd ..
          gh release create "hello-build-${GITHUB_RUN_NUMBER}" \
            release-assets/Exp2011App-unsigned.ipa release-assets/Exp2011App-OneClick-Windows.zip release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Hello iPhone Test ${GITHUB_RUN_NUMBER}" --latest \
            --notes $'Windows one-click Hello iPhone test.\n\nThis Release is published only after Dadoum/Sideloader is cross-built with its Windows x86_64-msvc toolchain, then that exact executable completes fresh Apple Music/CoreADI provisioning on a GitHub Windows runner without a native crash.'

  report-status:
    needs: [build-ios, build-sideloader-windows, build-windows-installer, release]
    if: always() && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-status]'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_RESULT: ${{ needs.build-ios.result }}
      SIDELOADER_RESULT: ${{ needs.build-sideloader-windows.result }}
      WINDOWS_RESULT: ${{ needs.build-windows-installer.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
    steps:
      - name: Write build status to main
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg run_id "$GITHUB_RUN_ID" --arg run_number "$GITHUB_RUN_NUMBER" --arg source_sha "$GITHUB_SHA" \
            --arg ios "$IOS_RESULT" --arg sideloader "$SIDELOADER_RESULT" --arg windows "$WINDOWS_RESULT" --arg release "$RELEASE_RESULT" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{run_id:$run_id,run_number:$run_number,source_sha:$source_sha,build_ios:$ios,build_sideloader_windows:$sideloader,build_windows_installer:$windows,release:$release,run_url:$run_url}' > /tmp/status.json
          CONTENT="$(base64 -w0 /tmp/status.json)"
          OLD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/build-status.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$OLD_SHA" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" -f message='Update build status [skip release-status]' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" -f message='Update build status [skip release-status]' -f content="$CONTENT" -f branch=main >/dev/null
          fi
          cat /tmp/status.json
