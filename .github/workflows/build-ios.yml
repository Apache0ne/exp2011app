name: Build + Release iPhone Hello Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SIDELOADER_REPO: https://github.com/Dadoum/Sideloader.git
  SIDELOADER_COMMIT: a589cf11a3ac7c1c26b2f18aa5acdc8afb6dc915
  PROVISION_COMMIT: 645d56d8e8c86c057893321843db00b21f1aaeb2
  D_COMPILER: ldc-1.34.0
  LIBIMOBILEDEVICE_WINDOWS_TAG: v20260809-74585f8
  LIBIMOBILEDEVICE_WINDOWS_SHA256: 441d2180b6f4669668b037f57f9a3403c3315e4147a29316b358f8ea886ecec8

jobs:
  build-ios:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-status]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Build and safety-check real iPhone app
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project Exp2011App.xcodeproj -scheme Exp2011App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build

          APP='build/Build/Products/Release-iphoneos/Exp2011App.app'
          PLIST="$APP/Info.plist"
          BIN="$APP/Exp2011App"
          test -d "$APP"
          test -f "$PLIST"
          test -f "$BIN"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$PLIST")
          test "$BUNDLE_ID" = 'com.apache0ne.exp2011app'
          test "$PLATFORM" = 'iphoneos'
          file "$BIN" | tee /tmp/app-file.txt
          grep -q 'arm64' /tmp/app-file.txt

          # The Hello test must not acquire privacy-sensitive permissions.
          for key in \
            NSCameraUsageDescription \
            NSMicrophoneUsageDescription \
            NSPhotoLibraryUsageDescription \
            NSPhotoLibraryAddUsageDescription \
            NSLocationWhenInUseUsageDescription \
            NSLocationAlwaysAndWhenInUseUsageDescription \
            NSContactsUsageDescription \
            NSBluetoothAlwaysUsageDescription \
            NSLocalNetworkUsageDescription; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              echo "Forbidden permission key in Hello test: $key" >&2
              exit 1
            fi
          done
          echo 'iOS Hello safety gate: PASS'

          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Exp2011App-unsigned.ipa Payload
          unzip -l Exp2011App-unsigned.ipa
          shasum -a 256 Exp2011App-unsigned.ipa

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Exp2011App-unsigned-ipa
          path: Exp2011App-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  build-sideloader-windows:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-status]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Dadoum-compatible LDC
        uses: dlang-community/setup-dlang@2979e3ea011f6a234cd3a47dcbeb60f451c9635f
        with:
          compiler: ${{ env.D_COMPILER }}

      - name: Install Windows cross-target dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld p7zip-full
          ldc2 --version
          dub --version

      - name: Fetch exact Sideloader source and apply audited patches
        shell: bash
        run: |
          set -euo pipefail
          git clone "$SIDELOADER_REPO" sideloader-src
          git -C sideloader-src checkout --detach "$SIDELOADER_COMMIT"
          test "$(git -C sideloader-src rev-parse HEAD)" = "$SIDELOADER_COMMIT"
          python3 tools/sideloader/patch_sideloader.py sideloader-src
          ! grep -R --line-number --fixed-strings 'request.sslSetVerifyPeer(false);' sideloader-src/source/app
          grep -R --line-number --fixed-strings 'request.sslSetVerifyPeer(true);' sideloader-src/source/app
          grep -R --line-number --fixed-strings 'environment.get("SSL_CERT_FILE", "")' sideloader-src/source/app
          grep -R --line-number --fixed-strings 'request.sslSetCaCert(caCertPath);' sideloader-src/source/app

      # Keep this in lockstep with Dadoum/Sideloader's own
      # .github/actions/target-x86_64-windows-msvc/action.yml.
      - name: Configure Dadoum x86_64-windows-msvc target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ldc"
          LDC_VERSION_OUTPUT="$(ldc2 --version 2>&1)"
          LDC_VERSION="$(printf '%s\n' "$LDC_VERSION_OUTPUT" | sed -nE 's/^LDC - the LLVM D compiler \(([0-9]+\.[0-9]+\.[0-9]+)\):$/\1/p')"
          test "$LDC_VERSION" = '1.34.0'

          cat > "$HOME/.ldc/ldc2.conf" <<EOF
          "x86_64-.*-windows-msvc":
          {
              switches = [
                  "-defaultlib=phobos2-ldc,druntime-ldc",
              ];
              post-switches = [
                  "-I$HOME/ldc2-$LDC_VERSION-windows-x64/import",
              ];
              lib-dirs = [
                  "$HOME/ldc2-$LDC_VERSION-windows-x64/lib",
              ];
          };
          EOF

          LDC_ARCHIVE="ldc2-$LDC_VERSION-windows-x64.7z"
          curl -fL --retry 3 \
            "https://github.com/ldc-developers/ldc/releases/download/v$LDC_VERSION/$LDC_ARCHIVE" \
            -o "/tmp/$LDC_ARCHIVE"
          curl -fL --retry 3 \
            "https://github.com/ldc-developers/ldc/releases/download/v$LDC_VERSION/ldc2-$LDC_VERSION.sha256sums.txt" \
            -o /tmp/ldc-sha256sums.txt
          EXPECTED_LINE="$(grep "  $LDC_ARCHIVE$" /tmp/ldc-sha256sums.txt)"
          test -n "$EXPECTED_LINE"
          printf '%s\n' "$EXPECTED_LINE" | sed "s#  $LDC_ARCHIVE#  /tmp/$LDC_ARCHIVE#" | sha256sum -c -

          7z x "/tmp/$LDC_ARCHIVE" -o"$HOME" > /dev/null
          test -d "$HOME/ldc2-$LDC_VERSION-windows-x64/import"
          test -d "$HOME/ldc2-$LDC_VERSION-windows-x64/lib"

      - name: Build Sideloader for x86_64-windows-msvc
        shell: bash
        run: |
          set -euo pipefail
          cd sideloader-src
          dub build -b release-debug --compiler=ldc2 --arch x86_64-windows-msvc :cli-frontend
          test -f bin/sideloader.exe
          file bin/sideloader.exe
          sha256sum bin/sideloader.exe

      - name: Package cross-built Sideloader and corresponding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sideloader-dist
          cp sideloader-src/bin/sideloader.exe sideloader-dist/
          if [[ -f sideloader-src/bin/sideloader.pdb ]]; then cp sideloader-src/bin/sideloader.pdb sideloader-dist/; fi
          cat > sideloader-dist/sideloader-build-metadata.txt <<EOF
          Sideloader commit: $SIDELOADER_COMMIT
          Provision commit: $PROVISION_COMMIT
          LDC: 1.34.0
          Host: ubuntu-22.04
          Target: x86_64-windows-msvc
          Build: release-debug
          Local patches: TLS peer verification ON + explicit SSL_CERT_FILE CA; hidden Windows password; provisioning stage markers
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('sideloader-src')
          out = Path('sideloader-dist/Sideloader-source.zip')
          excluded = {'.git', '.dub', 'bin'}
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  rel = path.relative_to(root)
                  if any(part in excluded for part in rel.parts):
                      continue
                  if path.is_file():
                      z.write(path, Path('Sideloader-source') / rel)
          PY
          sha256sum sideloader-dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sideloader-windows-msvc
          path: sideloader-dist/
          if-no-files-found: error
          retention-days: 30

  build-windows-installer:
    needs: [build-ios, build-sideloader-windows]
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test launcher safety policy on Windows PowerShell 5.1
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $launcher = Join-Path $PWD 'tools/windows/Install-Hello-App.ps1'
          $trustHelper = Join-Path $PWD 'tools/windows/New-WindowsTrustBundle.ps1'

          $tokens = $null; $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($launcher,[ref]$tokens,[ref]$parseErrors)
          if (@($parseErrors).Count) { throw 'Launcher has PowerShell syntax errors' }
          $trustTokens = $null; $trustParseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($trustHelper,[ref]$trustTokens,[ref]$trustParseErrors)
          if (@($trustParseErrors).Count) { throw 'Windows trust helper has PowerShell syntax errors' }

          function Mock-OneDevice { '00000000-MOCK-IPHONE' }
          $devices = @(Mock-OneDevice)
          if ($devices.Count -ne 1 -or $devices[0] -ne '00000000-MOCK-IPHONE') { throw 'One-device regression' }
          $matches = @(Select-String -Path $launcher -Pattern '^\s*\$devices\s*=.*Get-ConnectedDevice')
          $bad = @($matches | Where-Object { $_.Line -notmatch '^\s*\$devices\s*=\s*@\(' })
          if ($bad.Count) { throw 'Found unwrapped device assignment' }

          $text = Get-Content $launcher -Raw
          if ($text -match '(?im)^\s*&\s*\$winget.*\sinstall\s') { throw 'Launcher may not auto-install Windows packages' }
          if ($text -match '(?im)^\s*&\s*\$tool.*\s+enable\s*$') { throw 'Launcher may not auto-enable Developer Mode' }
          if ($text -match '(?im)sideloader\.exe.*-d\s+install') { throw 'User installer may not run Sideloader TRACE mode' }
          if ($text -notmatch 'Assert-NotElevated') { throw 'Launcher must refuse Administrator mode' }
          if ($text -notmatch 'Verify-BundleIntegrity') { throw 'Launcher must verify bundle hashes' }
          if ($text -notmatch 'Initialize-WindowsTlsTrust') { throw 'Launcher must initialize Windows-root TLS trust' }
          if ($text -notmatch 'SSL_CERT_FILE') { throw 'Launcher must set SSL_CERT_FILE' }

          $trustText = Get-Content $trustHelper -Raw
          foreach ($forbidden in @('Import-Certificate','New-SelfSignedCertificate','certutil','Remove-Item Cert:','Move-Item Cert:','Set-Item Cert:')) {
            if ($trustText -match [regex]::Escape($forbidden)) { throw "Trust helper contains forbidden certificate-store mutation token: $forbidden" }
          }
          if ($trustText -notmatch [regex]::Escape('Cert:\CurrentUser\Root')) { throw 'Trust helper must read CurrentUser Root store' }
          if ($trustText -notmatch [regex]::Escape('Cert:\LocalMachine\Root')) { throw 'Trust helper must read LocalMachine Root store' }
          Write-Host 'PowerShell 5.1 + non-destructive launcher/trust safety gate: PASS'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Exp2011App-unsigned-ipa
          path: incoming

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sideloader-windows-msvc
          path: sideloader-dist

      - name: Verify cross-built Sideloader starts on Windows
        shell: powershell
        run: |
          $exe = Join-Path $PWD 'sideloader-dist/sideloader.exe'
          $metadata = Join-Path $PWD 'sideloader-dist/sideloader-build-metadata.txt'
          if (-not (Test-Path $exe)) { throw 'Missing cross-built sideloader.exe' }
          if (-not (Test-Path $metadata)) { throw 'Missing Sideloader build metadata' }
          Get-Content $metadata | ForEach-Object { Write-Host $_ }
          & $exe version
          if ($LASTEXITCODE) { throw 'Cross-built sideloader.exe did not start on Windows' }

      # CI may use debug output because no user's Apple credentials are present.
      - name: Real Windows CoreADI provisioning preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $preflight = Join-Path $env:RUNNER_TEMP 'exp2011app-adi-preflight'
          Remove-Item $preflight -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $preflight | Out-Null
          $env:SIDELOADER_CONFIG_DIR = $preflight

          $caFile = Join-Path $preflight 'windows-trusted-roots.pem'
          & (Join-Path $PWD 'tools/windows/New-WindowsTrustBundle.ps1') -OutputPath $caFile
          if (-not (Test-Path $caFile -PathType Leaf)) { throw 'Windows TLS trust export failed' }
          $env:SSL_CERT_FILE = $caFile
          Write-Host "CoreADI preflight SSL_CERT_FILE=$caFile"

          Push-Location (Join-Path $PWD 'sideloader-dist')
          $lines = @(& .\sideloader.exe -d team list 2>&1)
          $code = $LASTEXITCODE
          Pop-Location
          $lines | ForEach-Object { Write-Host $_ }
          $text = $lines -join "`n"
          Write-Host "CoreADI preflight exit=$code"
          if ($code -eq -1073741819 -or $code -eq 3221225477) { throw 'CoreADI access violation 0xC0000005 reproduced in CI' }
          if ($text -notmatch 'PROVISION-STAGE 3/3') { throw 'CoreADI provisioning did not return successfully' }
          if ($text -notmatch 'Logging in\.\.\.') { throw 'Did not reach post-provisioning login stage' }
          if ($code -ne 1) { throw "Expected noninteractive no-login exit 1, got $code" }
          Write-Host 'REAL WINDOWS COREADI PROVISIONING PASS' -ForegroundColor Green

      - name: Fetch and verify pinned Windows iPhone device runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force device-runtime | Out-Null
          gh release download "$env:LIBIMOBILEDEVICE_WINDOWS_TAG" --repo jrjr/libimobiledevice-windows `
            --pattern 'libimobile-suite-latest_w64.zip' --dir device-runtime
          $zip = Join-Path $PWD 'device-runtime/libimobile-suite-latest_w64.zip'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:LIBIMOBILEDEVICE_WINDOWS_SHA256) {
            throw "libimobiledevice runtime SHA256 mismatch: $actual"
          }
          Write-Host "Pinned libimobiledevice SHA256 PASS: $actual"
          Expand-Archive $zip device-runtime/extracted

      - name: Package, hash-manifest, and smoke-test Windows installer
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist/Exp2011App-OneClick-Windows'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item 'sideloader-dist/sideloader.exe' "$dist/sideloader.exe"
          if (Test-Path 'sideloader-dist/sideloader.pdb') { Copy-Item 'sideloader-dist/sideloader.pdb' "$dist/sideloader.pdb" }
          Copy-Item 'sideloader-dist/sideloader-build-metadata.txt' "$dist/sideloader-build-metadata.txt"
          Copy-Item 'sideloader-dist/Sideloader-source.zip' "$dist/Sideloader-source-$env:SIDELOADER_COMMIT.zip"
          Copy-Item incoming/Exp2011App-unsigned.ipa "$dist/Exp2011App-unsigned.ipa"
          Copy-Item tools/windows/Install-Hello-App.* $dist
          Copy-Item tools/windows/New-WindowsTrustBundle.ps1 $dist
          Copy-Item 'device-runtime/extracted/*' $dist -Recurse -Force

          function Alias-Dll([string[]]$patterns,[string]$name) {
            foreach ($p in $patterns) {
              $hit = Get-ChildItem $dist -File -Filter $p | Select-Object -First 1
              if ($hit) { Copy-Item $hit.FullName (Join-Path $dist $name) -Force; return }
            }
            throw "Missing DLL for $name"
          }
          Alias-Dll @('libimobiledevice-1.0*.dll','libimobiledevice*.dll') imobiledevice.dll
          Alias-Dll @('libplist-2.0*.dll','libplist*.dll') plist.dll
          Alias-Dll @('libusbmuxd-2.0*.dll','libusbmuxd*.dll') usbmuxd.dll
          if ($env:VCToolsRedistDir) {
            $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
            if (Test-Path $crt) { Copy-Item "$crt/*.dll" $dist -Force }
          }

          @"
          Exp2011App SAFE Hello Test
          iOS source: $env:GITHUB_SHA
          Sideloader: $env:SIDELOADER_COMMIT
          Provision: $env:PROVISION_COMMIT (upstream pin)
          LDC: 1.34.0 release-debug
          Sideloader build host: ubuntu-22.04
          Target: x86_64-windows-msvc
          Apple Music APK TLS peer verification: REQUIRED
          TLS CA source on user PC: read-only Windows CurrentUser/LocalMachine trusted Root stores
          Pinned Windows device runtime SHA256: $env:LIBIMOBILEDEVICE_WINDOWS_SHA256
          User installer elevation: REFUSED
          Automatic Windows package installation: DISABLED
          Automatic Developer Mode/reboot: DISABLED
          User TRACE authentication logging: DISABLED
          GitHub Windows CoreADI provisioning preflight: PASS
          Run: Install-Hello-App.cmd
          "@ | Set-Content "$dist/README-FIRST.txt"

          $required = @(
            'sideloader.exe','sideloader-build-metadata.txt','Exp2011App-unsigned.ipa',
            'Install-Hello-App.cmd','Install-Hello-App.ps1','New-WindowsTrustBundle.ps1',
            'idevice_id.exe','idevicepair.exe','idevicedevmodectl.exe',
            'imobiledevice.dll','plist.dll','usbmuxd.dll'
          )
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $dist $f))) { throw "Missing $f" }
          }

          Push-Location $dist
          & .\sideloader.exe version; if ($LASTEXITCODE) { throw 'sideloader smoke test failed' }
          & .\idevice_id.exe --version; if ($LASTEXITCODE) { throw 'idevice_id smoke test failed' }
          & .\idevicepair.exe --version; if ($LASTEXITCODE) { throw 'idevicepair smoke test failed' }
          & .\idevicedevmodectl.exe --version; if ($LASTEXITCODE) { throw 'idevicedevmodectl smoke test failed' }
          Pop-Location

          $manifest = Join-Path $dist 'BUNDLE-SHA256SUMS.txt'
          $manifestLines = foreach ($file in (Get-ChildItem $dist -Recurse -File | Sort-Object FullName)) {
            if ($file.FullName -eq $manifest) { continue }
            $relative = $file.FullName.Substring($dist.Length + 1)
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
            "$hash`t$relative"
          }
          $manifestLines | Set-Content $manifest -Encoding ASCII
          if (-not (Test-Path $manifest)) { throw 'Failed to create bundle SHA256 manifest' }

          foreach ($line in (Get-Content $manifest)) {
            $parts = $line -split "`t", 2
            if ($parts.Count -ne 2) { throw "Bad manifest line: $line" }
            $path = Join-Path $dist $parts[1]
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($actual -ne $parts[0]) { throw "Manifest self-check failed: $($parts[1])" }
          }
          Write-Host 'Internal bundle SHA256 manifest: PASS'

          Compress-Archive "$dist/*" Exp2011App-OneClick-Windows.zip -CompressionLevel Optimal
          Get-FileHash Exp2011App-OneClick-Windows.zip -Algorithm SHA256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Exp2011App-OneClick-Windows
          path: Exp2011App-OneClick-Windows.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-ios, build-windows-installer]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Exp2011App-unsigned-ipa
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Exp2011App-OneClick-Windows
          path: release-assets

      - name: Publish safety-gated Release
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum Exp2011App-unsigned.ipa Exp2011App-OneClick-Windows.zip > SHA256SUMS.txt
          cd ..
          gh release create "hello-build-${GITHUB_RUN_NUMBER}" \
            release-assets/Exp2011App-unsigned.ipa release-assets/Exp2011App-OneClick-Windows.zip release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Hello iPhone Test ${GITHUB_RUN_NUMBER}" --latest \
            --notes $'Safety-gated Windows Hello iPhone test. The release is published only after the real ARM64 iPhone build, exact Dadoum Windows cross-build, certificate-verified Apple HTTPS/CoreADI preflight using Windows trusted roots, pinned device-runtime SHA256 check, non-destructive launcher policy checks, binary smoke tests, and internal bundle SHA256 verification all pass. The user launcher does not auto-install Windows software, run elevated, auto-enable Developer Mode, reboot the iPhone, erase/restore/update the device, or enable TRACE authentication logging.'

  report-status:
    needs: [build-ios, build-sideloader-windows, build-windows-installer, release]
    if: always() && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-status]'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_RESULT: ${{ needs.build-ios.result }}
      SIDELOADER_RESULT: ${{ needs.build-sideloader-windows.result }}
      WINDOWS_RESULT: ${{ needs.build-windows-installer.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
    steps:
      - name: Write build status to main
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg run_id "$GITHUB_RUN_ID" --arg run_number "$GITHUB_RUN_NUMBER" --arg source_sha "$GITHUB_SHA" \
            --arg ios "$IOS_RESULT" --arg sideloader "$SIDELOADER_RESULT" --arg windows "$WINDOWS_RESULT" --arg release "$RELEASE_RESULT" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{run_id:$run_id,run_number:$run_number,source_sha:$source_sha,build_ios:$ios,build_sideloader_windows:$sideloader,build_windows_installer:$windows,release:$release,run_url:$run_url}' > /tmp/status.json
          CONTENT="$(base64 -w0 /tmp/status.json)"
          OLD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/build-status.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$OLD_SHA" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" -f message='Update build status [skip release-status]' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" -f message='Update build status [skip release-status]' -f content="$CONTENT" -f branch=main >/dev/null
          fi
          cat /tmp/status.json
