name: Build + Release iPhone Hello Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SIDELOADER_COMMIT: a589cf11a3ac7c1c26b2f18aa5acdc8afb6dc915
  PROVISION_COMMIT: 7717ce1f7b3c9779fe9982005d07b6665071a239
  LIBIMOBILEDEVICE_WINDOWS_TAG: v20260809-74585f8

jobs:
  build-ios:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-status]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Exp2011App.xcodeproj \
            -scheme Exp2011App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Exp2011App.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry Exp2011App-unsigned.ipa Payload
          unzip -l Exp2011App-unsigned.ipa
          shasum -a 256 Exp2011App-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Exp2011App-unsigned-ipa
          path: Exp2011App-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  build-windows-installer:
    needs: build-ios
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Regression-test launcher in Windows PowerShell 5.1
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $launcher = Join-Path $PWD 'tools/windows/Install-Hello-App.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($launcher, [ref]$tokens, [ref]$parseErrors)
          if (@($parseErrors).Count -ne 0) {
            $parseErrors | Format-List | Out-String | Write-Host
            throw 'Install-Hello-App.ps1 has PowerShell syntax errors'
          }

          function Mock-OneConnectedDevice { '00000000-MOCK-IPHONE-UDID' }
          $devices = @(Mock-OneConnectedDevice)
          if ($devices.Count -ne 1) { throw "One-device normalization failed: Count=$($devices.Count)" }
          if ($devices[0] -ne '00000000-MOCK-IPHONE-UDID') { throw 'One-device indexing failed' }

          $assignments = @(Select-String -Path $launcher -Pattern '^\s*\$devices\s*=.*Get-ConnectedDevice')
          $badAssignments = @($assignments | Where-Object { $_.Line -notmatch '^\s*\$devices\s*=\s*@\(' })
          if ($badAssignments.Count -ne 0) {
            $badAssignments | ForEach-Object { Write-Host $_.Line }
            throw 'Found an unwrapped connected-device assignment'
          }
          Write-Host 'Windows PowerShell 5.1 launcher regression test passed.'

      - uses: actions/download-artifact@v4
        with:
          name: Exp2011App-unsigned-ipa
          path: incoming

      - name: Set up current LDC
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-1.42.0

      - name: Download pinned open-source Sideloader source
        shell: pwsh
        run: |
          $url = "https://github.com/Dadoum/Sideloader/archive/$env:SIDELOADER_COMMIT.zip"
          Invoke-WebRequest -Uri $url -OutFile Sideloader-source.zip
          Expand-Archive Sideloader-source.zip -DestinationPath sideloader-src
          $dir = Get-ChildItem sideloader-src -Directory | Select-Object -First 1
          if (-not $dir) { throw 'Sideloader source archive did not extract' }
          "SIDELOADER_DIR=$($dir.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Patch Windows runtime and Provision dependency
        shell: pwsh
        run: |
          python tools/sideloader/patch_sideloader.py "$env:SIDELOADER_DIR"
          $dub = Get-Content "$env:SIDELOADER_DIR/dub.json" -Raw | ConvertFrom-Json
          if ($dub.dependencies.provision.version -ne $env:PROVISION_COMMIT) {
            throw "Provision pin mismatch: $($dub.dependencies.provision.version)"
          }
          Write-Host "Using Provision $env:PROVISION_COMMIT"
          ldc2 --version

      - name: Build traced Sideloader CLI
        shell: pwsh
        run: |
          Push-Location "$env:SIDELOADER_DIR"
          dub build -b debug --compiler=ldc2 :cli-frontend
          Pop-Location
          if (-not (Test-Path "$env:SIDELOADER_DIR/bin/sideloader.exe")) { throw 'Missing sideloader.exe' }

      - name: Download Windows iPhone runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force device-runtime | Out-Null
          gh release download "$env:LIBIMOBILEDEVICE_WINDOWS_TAG" `
            --repo jrjr/libimobiledevice-windows `
            --pattern 'libimobile-suite-latest_w64.zip' `
            --dir device-runtime
          Expand-Archive device-runtime/libimobile-suite-latest_w64.zip -DestinationPath device-runtime/extracted

      - name: Assemble and smoke-test Windows package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist/Exp2011App-OneClick-Windows'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "$env:SIDELOADER_DIR/bin/sideloader.exe" "$dist/sideloader.exe"
          Get-ChildItem "$env:SIDELOADER_DIR" -Recurse -Filter 'sideloader.pdb' -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { Copy-Item $_.FullName "$dist/sideloader.pdb" -Force }
          Copy-Item incoming/Exp2011App-unsigned.ipa "$dist/Exp2011App-unsigned.ipa"
          Copy-Item tools/windows/Install-Hello-App.cmd "$dist/Install-Hello-App.cmd"
          Copy-Item tools/windows/Install-Hello-App.ps1 "$dist/Install-Hello-App.ps1"
          Copy-Item Sideloader-source.zip "$dist/Sideloader-source-$env:SIDELOADER_COMMIT.zip"
          Copy-Item 'device-runtime/extracted/*' $dist -Recurse -Force

          function Copy-DllAlias([string[]]$patterns, [string]$alias) {
            foreach ($pattern in $patterns) {
              $hit = Get-ChildItem $dist -File -Filter $pattern | Select-Object -First 1
              if ($hit) {
                Copy-Item $hit.FullName (Join-Path $dist $alias) -Force
                return
              }
            }
            throw "Could not create DLL alias $alias"
          }
          Copy-DllAlias @('libimobiledevice-1.0*.dll','libimobiledevice*.dll') 'imobiledevice.dll'
          Copy-DllAlias @('libplist-2.0*.dll','libplist*.dll') 'plist.dll'
          Copy-DllAlias @('libusbmuxd-2.0*.dll','libusbmuxd*.dll') 'usbmuxd.dll'

          if ($env:VCToolsRedistDir) {
            $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
            if (Test-Path $crt) { Copy-Item "$crt/*.dll" $dist -Force }
          }

          @"
          Exp2011App Hello Test - Windows installer bundle
          iOS source commit: $env:GITHUB_SHA
          Sideloader commit: $env:SIDELOADER_COMMIT
          Provision commit: $env:PROVISION_COMMIT
          LDC: 1.42.0 / debug traced build
          Start: double-click Install-Hello-App.cmd
          "@ | Set-Content "$dist/README-FIRST.txt"

          $required = @(
            'sideloader.exe','Exp2011App-unsigned.ipa','Install-Hello-App.cmd','Install-Hello-App.ps1',
            'idevice_id.exe','idevicepair.exe','idevicedevmodectl.exe','imobiledevice.dll','plist.dll','usbmuxd.dll'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $dist $name))) { throw "Missing packaged file: $name" }
          }

          Push-Location $dist
          & .\sideloader.exe version
          if ($LASTEXITCODE -ne 0) { throw "sideloader.exe smoke test failed: $LASTEXITCODE" }
          & .\idevice_id.exe --version
          if ($LASTEXITCODE -ne 0) { throw "idevice_id.exe smoke test failed: $LASTEXITCODE" }
          & .\idevicepair.exe --version
          if ($LASTEXITCODE -ne 0) { throw "idevicepair.exe smoke test failed: $LASTEXITCODE" }
          & .\idevicedevmodectl.exe --version
          if ($LASTEXITCODE -ne 0) { throw "idevicedevmodectl.exe smoke test failed: $LASTEXITCODE" }
          Pop-Location

          Compress-Archive -Path "$dist/*" -DestinationPath Exp2011App-OneClick-Windows.zip -CompressionLevel Optimal
          Get-FileHash Exp2011App-OneClick-Windows.zip -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: Exp2011App-OneClick-Windows
          path: Exp2011App-OneClick-Windows.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [build-ios, build-windows-installer]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Exp2011App-unsigned-ipa
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: Exp2011App-OneClick-Windows
          path: release-assets

      - name: Create checksums and publish Release
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum Exp2011App-unsigned.ipa Exp2011App-OneClick-Windows.zip > SHA256SUMS.txt
          cd ..
          TAG="hello-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            release-assets/Exp2011App-unsigned.ipa \
            release-assets/Exp2011App-OneClick-Windows.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Hello iPhone Test ${GITHUB_RUN_NUMBER}" \
            --notes $'End-to-end Hello iPhone sideload test.\n\nThis build updates the Windows ADI runtime to Provision 7717ce1, LDC 1.42, a debug-capable traced Sideloader build, isolated provisioning state, and automatic Apple Devices startup.\n\nDownload `Exp2011App-OneClick-Windows.zip`, extract it, connect and unlock the iPhone, then double-click `Install-Hello-App.cmd`.' \
            --latest

  report-status:
    needs: [build-ios, build-windows-installer, release]
    if: always() && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release-status]'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_RESULT: ${{ needs.build-ios.result }}
      WINDOWS_RESULT: ${{ needs.build-windows-installer.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
    steps:
      - name: Write build-status.json to main
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg source_sha "$GITHUB_SHA" \
            --arg ios "$IOS_RESULT" \
            --arg windows "$WINDOWS_RESULT" \
            --arg release "$RELEASE_RESULT" \
            --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{run_id:$run_id,run_number:$run_number,source_sha:$source_sha,build_ios:$ios,build_windows_installer:$windows,release:$release,run_url:$run_url}' \
            > /tmp/build-status.json
          CONTENT="$(base64 -w0 /tmp/build-status.json)"
          OLD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/build-status.json?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$OLD_SHA" ]]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" \
              -f message='Update build status [skip release-status]' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" \
              -f message='Update build status [skip release-status]' -f content="$CONTENT" -f branch=main >/dev/null
          fi
          cat /tmp/build-status.json
