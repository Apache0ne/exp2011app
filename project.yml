name: Exp2011App

options:
  bundleIdPrefix: com.apache0ne
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

schemes:
  Exp2011App:
    build:
      targets:
        Exp2011App: all


targets:
  Exp2011App:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apache0ne.exp2011app
        PRODUCT_NAME: Exp2011App
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: exp2011app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
